<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="asd.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div id="cont">
        <div id="vehlistcont">
            <div id="label">
                <i id="garageicon" class="fa fa-car"></i>
                <span id="garagelabel">Asd Garage</span>
            </div>
            <div id="searchcont">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchinput" type="search" placeholder="Search">
                <div id="colorpickercont">
                    <input id="colorpicker" type="color" >
                </div>
            </div>
            <div id="vehlist"></div>
            <div id="bott">
                <span id="close" onclick="toggleUi(false)">Press ESC to close</span>
            </div>
        </div>
        <button id="drive" onclick="spawnVeh(selected.model)">DRIVE</button>
        <div id="loader"></div>
    </div>
    <script src="asd.js"></script>
</body>
</html>
